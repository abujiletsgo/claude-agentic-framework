# CAF Orchestration Configuration
# Single source of truth for IPC, logging, and wave definitions.

orchestration:
  # IPC filesystem — where all orch run data lives
  ipc:
    base_dir: "/tmp/caf_orch"
    poll_interval_seconds: 5

  # structured logging per run
  logging:
    events_format: "jsonl"         # events.jsonl per run, read by run-explorer
    include_token_counts: true
    include_timing: true
    archive_on_teardown: true      # copy events.jsonl to ~/.claude/data/sprint_events/

  # wave definitions for the consultant model
  waves:
    consultation: { name: "Consult", parallel: false, gate: true }   # user ↔ consultants
    research:     { name: "Research", parallel: true,  gate: true }   # parallel researchers
    build:        { name: "Build",    parallel: true,  gate: true }   # parallel builders
    qa:           { name: "QA",       parallel: false, gate: true }   # validator → qa loop
    deliver:      { name: "Deliver",  parallel: false, gate: false }  # final report

  # graceful degradation
  fallback:
    no_agents: "direct"   # fall back to single-agent if spawning fails
