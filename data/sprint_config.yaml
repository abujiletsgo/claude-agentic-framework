# CAF Sprint System Configuration
# Single source of truth — everything reads this

sprint:
  # gstack (upstream dependency, never modified)
  gstack:
    path: "~/.claude/skills/gstack"
    auto_update_check_days: 7

  # tmux
  tmux:
    session_prefix: "sprint"
    layout: "tiled"
    dashboard_pane_width_pct: 28

  # cmux (highest priority when available — native macOS, richest visuals)
  cmux:
    socket_path: "~/Library/Application Support/cmux/cmux.sock"   # overridable via CMUX_SOCKET_PATH
    default_split_direction: "right"
    fallback_split_direction: "down"
    sidebar_progress: true                    # use set-progress API
    sidebar_status: true                      # use set-status API

  # IPC filesystem
  ipc:
    base_dir: "/tmp/caf_orch"
    poll_interval_seconds: 5

  # mempalace — long-term memory, NOT real-time compression
  memory:
    wing: "claude-agentic-framework"
    sprint_room: "sprint_results"           # palace: lead results stored here
    decision_room: "sprint_decisions"        # KG: decisions stored here
    aaak_compress_on_store: true             # compress lead results before palace write
    max_store_chars: 4000                    # truncate before storage
    kg_decision_extraction: true             # extract decisions → KG triples
    kg_inject_max_tokens: 375               # SubagentStart KG budget
    sprint_context_max_chars: 2000          # SubagentStart sprint context budget

  # structured logging
  logging:
    events_format: "jsonl"
    include_token_counts: true
    include_timing: true
    audit_trail: true
    archive_on_teardown: true               # copy events.jsonl to ~/.claude/data/sprint_events/
    archive_aaak_compress: true             # AAAK-compress archived events for space

  # wave definitions
  waves:
    0: { name: "Plan", parallel: true, gate: true, failure_policy: "block" }
    1: { name: "Build", parallel: true, gate: true, failure_policy: "escalate" }
    2: { name: "Validate", parallel: true, gate: true, failure_policy: "escalate" }
    3: { name: "Ship", parallel: false, gate: false, failure_policy: "block" }

  # Lead roster — ALL gstack skills are potential leads.
  # PM picks dynamically based on task. These are the available types.
  # Leads are DELEGATING PLANNERS only — they spawn workers, never build directly.
  #
  # Research is a SHARED POOL, not a per-lead role:
  #   - PM collects all research needs upfront (Wave 0)
  #   - Deduplicates + launches shared researchers once
  #   - Research files land in /tmp/caf_orch/<id>/shared/research/
  #   - Lead prompts reference these files directly (no per-lead re-research)
  #
  # devex-lead is MERGED into review-lead (overlapping scope).
  leads:
    architecture-lead:
      gstack_skills: ["/arch-map"]
      caf_fallback_agents: ["researcher"]
      description: "System design, dependency mapping, ADRs — delegates to researchers + builders"
      token_budget: 50000

    planning-lead:
      gstack_skills: ["/autoplan", "/plan-ceo-review", "/plan-eng-review",
                      "/plan-design-review", "/plan-devex-review"]
      caf_fallback_agents: ["researcher"]
      description: "Full task decomposition — delegates to researchers, writes the plan"
      token_budget: 50000

    engineering-lead:
      gstack_skills: ["/investigate", "/careful", "/pair-agent", "/fusion"]
      caf_fallback_agents: ["builder", "validator", "researcher"]
      description: "Implementation planning — delegates to builders + validators"
      token_budget: 100000

    design-lead:
      gstack_skills: ["/design-consultation", "/design-html", "/plan-design-review",
                      "/design-review", "/design-shotgun"]
      caf_fallback_agents: ["builder", "researcher"]
      description: "UX/visual direction — delegates to design builders"
      token_budget: 60000

    review-lead:
      gstack_skills: ["/review", "/codex", "/code-review", "/devex-review", "/plan-devex-review"]
      caf_fallback_agents: ["critical-analyst"]
      description: "Code review + DX planning — delegates reviews and developer experience audits"
      token_budget: 60000

    qa-lead:
      gstack_skills: ["/qa", "/qa-only", "/browse", "/gstack"]
      caf_fallback_agents: ["validator"]
      description: "QA planning — delegates E2E + unit test runners"
      token_budget: 80000

    security-lead:
      gstack_skills: ["/cso", "/security-scanner"]
      caf_fallback_agents: ["scout-report-suggest"]
      description: "Threat modeling — delegates security scans + audits"
      token_budget: 40000

    performance-lead:
      gstack_skills: ["/benchmark"]
      caf_fallback_agents: ["validator", "researcher"]
      description: "Perf planning — delegates profilers + benchmark runners"
      token_budget: 40000

    refactoring-lead:
      gstack_skills: ["/refactoring-assistant"]
      caf_fallback_agents: ["builder", "critical-analyst"]
      description: "Refactor strategy — delegates builders for execution"
      token_budget: 60000

    debugging-lead:
      gstack_skills: ["/investigate", "/error-analyzer", "/solve", "/fusion"]
      caf_fallback_agents: ["debugger", "researcher"]
      description: "Root cause analysis — delegates debuggers + investigators"
      token_budget: 60000

    testing-lead:
      gstack_skills: ["/test-generator", "/test-scout"]
      caf_fallback_agents: ["validator", "builder"]
      description: "Test strategy — delegates test writers + runners"
      token_budget: 50000

    release-lead:
      gstack_skills: ["/ship", "/land-and-deploy", "/canary", "/setup-deploy", "/rollback"]
      caf_fallback_agents: []
      description: "Ship planning — delegates deploy steps + monitors"
      token_budget: 30000

    docs-lead:
      gstack_skills: ["/document-release", "/retro"]
      caf_fallback_agents: ["builder"]
      description: "Documentation planning — delegates writers"
      token_budget: 30000

  # graceful degradation
  fallback:
    no_cmux_no_tmux: "sequential_agents"   # leads run as Agent() calls
    no_cmux: "tmux"                        # fallback to tmux when cmux absent
    no_tmux: "sequential_agents"           # existing behavior
    no_gstack: "caf_skills"
    no_both: "orchestrate"
