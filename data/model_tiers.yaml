# Multi-Model Tier Configuration
#
# Post-audit (2026-07-12): retired the weak-model assembly line. The old roster
# (builder → validator → debugger relaying through /tmp files, watchdog polling,
# scout/docs-scraper relays) existed because earlier models needed narrow roles
# and external supervision. Fable-5-class models plan, build, test and diagnose
# in one context, so those agents were removed rather than re-tiered.
#
# Surviving agents are the ones native Claude Code cannot replace: the
# interactive Wave 0a consultants (Workflow cannot pause to interrogate the
# user), adversarial review, and MCP-tool-gated specialists.

default_model: sonnet

# ─── Tier Definitions ───────────────────────────────────────────────

tiers:
  fable:
    model_id: claude-fable-5
    use_for:
      - Adversarial evaluation (where a stronger model changes the verdict)
      - Orchestration synthesis — reconciling conflicting consultant specs

  opus:
    model_id: claude-opus-4-8
    use_for:
      - Architecture consulting (blast-radius reasoning)
      - Security consulting (threat modeling)
      - Builders on security/crypto/irreversible work

  sonnet:
    model_id: claude-sonnet-5
    max_turns_default: 25
    use_for:
      - Standard builders (implement + run own tests + self-diagnose)
      - Frontend/backend consulting
      - Project onboarding
      - Academic research (papers MCP)

  haiku:
    model_id: claude-haiku-4-5-20251001
    use_for:
      - Mechanical transforms, if any survive
      # NOTE: this tier is intentionally empty. Its four former occupants
      # (validator, agent-watchdog, health-checker, docs-scraper) were retired:
      # a separate agent that only relays PASS/FAIL, polls for stuck agents,
      # or fetches a URL costs a full round-trip to do what the main agent,
      # native background-task notifications, and WebFetch already do.

# ─── Agent Assignments ──────────────────────────────────────────────
# 1 Fable, 2 Opus, 5 Sonnet — down from 22 agents.
# Consultant model: Wave 0a = user ↔ consultants (interactive spec) → Workflow fan-out.

agent_tiers:
  fable:
    - critical-analyst        # Adversarial review / opt-in evaluator

  opus:
    - architecture-consultant # System design, blast radius — interactive spec
    - security-consultant     # Auth, input handling, threat model — interactive spec

  sonnet:
    - frontend-consultant     # UI, UX, components — interactive spec
    - backend-consultant      # API, data, services — interactive spec
    - builder                 # Implementation; runs its own tests, self-diagnoses
    - onboard                 # Project init (planner+builder merged)
    - academic-researcher     # Papers-MCP-gated specialization

  haiku: []

# ─── Skill Overrides ────────────────────────────────────────────────
# Skills whose CAF implementations were retired in favour of native built-ins
# (/code-review, /security-review, /simplify) no longer need model pins.

skill_default_models:
  knowledge-db: haiku     # Mechanical DB ops, speed matters

# ─── Decision Matrix ────────────────────────────────────────────────

decision_matrix:
  - condition: "Adversarial evaluation, conflicting-spec synthesis"
    model: fable
  - condition: "Architecture, security, or irreversible-change reasoning"
    model: opus
  - condition: "Implementation, consulting, research, onboarding"
    model: sonnet
  - condition: "Unknown complexity"
    model: sonnet  # Default to capable workhorse
